<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07131e">
<title>Incoming Call</title>
<style>
  :root{
    --ink:#07131e;
    --cyan:#5ce6ed;
    --violet:#9377ff;
    --text-soft:#c9d6df;
    --line:rgba(255,255,255,.1);
    --ease: cubic-bezier(.22,1,.36,1);
    --accept:#3ee08a;
    --decline:#ff5470;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    background:#000; color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:fixed; inset:0;
    background:
      radial-gradient(90% 55% at 50% -10%, rgba(92,230,237,.16) 0%, transparent 55%),
      radial-gradient(70% 50% at 90% 100%, rgba(147,119,255,.14) 0%, transparent 60%),
      radial-gradient(120% 90% at 50% 100%, #0b1620 0%, #050b12 55%, #000 100%);
    overflow:hidden;
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    padding: calc(env(safe-area-inset-top,0px) + 60px) 22px calc(env(safe-area-inset-bottom,0px) + 34px);
    opacity:0; pointer-events:none;
    transform:translateY(14px) scale(.985);
    transition:opacity .38s var(--ease), transform .38s var(--ease);
  }
  .screen.active{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }

  /* ---------- Incoming invite screen ---------- */
  #inviteScreen{ justify-content:space-between; }
  .invite-top{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .invite-eyebrow{ font-size:11px; letter-spacing:.22em; color:var(--cyan); font-weight:700; text-transform:uppercase; opacity:.9; }

  .invite-avatar-wrap{
    margin-top:26px; width:150px; height:150px; border-radius:50%;
    position:relative; display:flex; align-items:center; justify-content:center;
  }
  .invite-avatar-wrap::before, .invite-avatar-wrap::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(92,230,237,.35);
    pointer-events:none;
  }
  .invite-avatar-wrap::before{ animation:ringExpand 1.7s var(--ease) infinite; }
  .invite-avatar-wrap::after{ animation:ringExpand 1.7s var(--ease) infinite .6s; }
  @keyframes ringExpand{
    0%{ transform:scale(.82); opacity:.9; }
    100%{ transform:scale(1.6); opacity:0; }
  }
  .invite-avatar{
    position:relative;
    width:104px; height:104px; border-radius:50%;
    background:linear-gradient(145deg,var(--cyan),var(--violet));
    background-size:cover; background-position:center;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:42px; font-weight:950;
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 24px rgba(255,255,255,.16);
    cursor:pointer;
  }

  .invite-name{ margin-top:18px; font-size:26px; font-weight:800; letter-spacing:.01em; }
  .invite-handle{ font-size:14px; color:var(--text-soft); opacity:.75; margin-top:2px; }

  .invite-question{
    margin-top:22px; max-width:300px;
    font-size:21px; font-weight:750; line-height:1.32; text-align:center;
    text-wrap:balance;
  }

  .invite-actions{ width:100%; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .action-row{ display:flex; gap:44px; align-items:center; }
  .action-btn{
    width:68px; height:68px; border-radius:50%;
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 34px rgba(0,0,0,.35);
    transition:transform .14s var(--ease), filter .14s ease;
  }
  .action-btn:active{ transform:scale(.94); filter:brightness(.95); }
  .action-btn svg{ width:26px; height:26px; }
  .decline-btn{ background:var(--decline); }
  .accept-btn{ background:linear-gradient(145deg,var(--cyan),var(--violet)); }
  .action-label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-soft); opacity:.75; text-align:center; }
  .action-labels{ display:flex; gap:44px; }
  .action-labels span{ width:68px; text-align:center; }

  /* ---------- Joined / live screen: full-screen gray chroma ---------- */
  .chroma-screen{ padding:0; }
  .chroma-bg{
    position:absolute; inset:0;
    background:#808080;
  }
  .corner-mark{ position:absolute; width:30px; height:30px; }
  .corner-mark::before, .corner-mark::after{ content:""; position:absolute; background:rgba(0,0,0,.5); }
  .corner-mark::before{ top:50%; left:0; width:100%; height:4px; transform:translateY(-50%); }
  .corner-mark::after{ left:50%; top:0; height:100%; width:4px; transform:translateX(-50%); }
  .corner-mark.tl{ top: calc(env(safe-area-inset-top,0px) + 24px); left:24px; }
  .corner-mark.tr{ top: calc(env(safe-area-inset-top,0px) + 24px); right:24px; }
  .corner-mark.bl{ bottom: calc(env(safe-area-inset-bottom,0px) + 24px); left:24px; }
  .corner-mark.br{ bottom: calc(env(safe-area-inset-bottom,0px) + 24px); right:24px; }

  .chroma-end{
    position:absolute; left:50%; bottom: calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translateX(-50%);
    padding:10px 22px; border-radius:20px;
    background:rgba(0,0,0,.28); color:rgba(255,255,255,.55);
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
    border:1px solid rgba(255,255,255,.22);
    cursor:pointer;
    transition:opacity .14s ease;
  }
  .chroma-end:active{ opacity:.7; }

  /* ---------- Ended ---------- */
  #endScreen{ justify-content:center; align-items:center; gap:14px; }
  .end-eyebrow{ font-size:11px; letter-spacing:.22em; color:var(--cyan); font-weight:700; text-transform:uppercase; opacity:.9; }
  .end-title{ font-size:25px; font-weight:800; }
  .end-time{ font-size:13.5px; color:var(--text-soft); font-variant-numeric:tabular-nums; }
  .redo-btn{
    margin-top:28px;
    padding:13px 28px; border-radius:6px;
    background:transparent; border:1px solid var(--line);
    color:#fff; font-size:13px; font-weight:700; letter-spacing:.04em; cursor:pointer;
    transition:transform .14s var(--ease), border-color .12s ease;
  }
  .redo-btn:active{ transform:scale(.96); border-color:rgba(255,255,255,.32); }
</style>
</head>
<body>
<div id="app">
  <!-- Incoming invite -->
  <section id="inviteScreen" class="screen active">
    <div class="invite-top">
      <div class="invite-eyebrow">Incoming Video Call</div>
      <div class="invite-avatar-wrap">
        <div class="invite-avatar" id="inviteAvatar">
          <span class="avatar-letter" id="avatarLetter">H</span>
        </div>
      </div>
      <input type="file" id="avatarFileInput" accept="image/*" hidden>
      <div class="invite-name">Helen Wildson</div>
      <div class="invite-handle">@helenwildson</div>
    </div>

    <div class="invite-question">DO YOU WANT TO JOIN<br>THE LIVE STREAM?</div>

    <div class="invite-actions">
      <div class="action-row">
        <button class="action-btn decline-btn" id="declineButton" aria-label="Decline">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
        <button class="action-btn accept-btn" id="acceptButton" aria-label="Join">
          <svg viewBox="0 0 24 24" fill="none" stroke="#07131e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg>
        </button>
      </div>
      <div class="action-labels">
        <span class="action-label">Decline</span>
        <span class="action-label">Join</span>
      </div>
    </div>
  </section>

  <!-- Joined / live: full-screen chroma, ready to composite the call video in post -->
  <section id="liveScreen" class="screen chroma-screen">
    <div class="chroma-bg" id="chromaBg"></div>
    <div class="corner-mark tl"></div>
    <div class="corner-mark tr"></div>
    <div class="corner-mark bl"></div>
    <div class="corner-mark br"></div>
    <button class="chroma-end" id="leaveButton">End</button>
  </section>

  <!-- Ended -->
  <section id="endScreen" class="screen">
    <div class="end-eyebrow">Video Call</div>
    <div class="end-title">Stream Ended</div>
    <div class="end-time" id="endTime">Connection lost</div>
    <button class="redo-btn" id="redoButton">Back</button>
  </section>
</div>

<script>
(function(){
  "use strict";
  var inviteScreen = document.getElementById('inviteScreen');
  var liveScreen    = document.getElementById('liveScreen');
  var endScreen     = document.getElementById('endScreen');
  var chromaBg      = document.getElementById('chromaBg');
  var chromaColors  = ['#808080', '#00b140', '#0047ab', '#ffffff'];
  var chromaIndex   = 0;

  var inviteAvatar   = document.getElementById('inviteAvatar');
  var avatarLetter   = document.getElementById('avatarLetter');
  var avatarFileInput = document.getElementById('avatarFileInput');
  var AVATAR_KEY = 'fakecall_helen_avatar';

  function applyAvatar(dataUrl){
    if (dataUrl){
      inviteAvatar.style.backgroundImage = 'url(' + dataUrl + ')';
      avatarLetter.style.display = 'none';
    } else {
      inviteAvatar.style.backgroundImage = 'none';
      avatarLetter.style.display = '';
    }
  }

  try {
    var savedAvatar = localStorage.getItem(AVATAR_KEY);
    if (savedAvatar) applyAvatar(savedAvatar);
  } catch(e){}

  avatarFileInput.addEventListener('change', function(){
    var file = avatarFileInput.files && avatarFileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      try { localStorage.setItem(AVATAR_KEY, dataUrl); } catch(e){}
      applyAvatar(dataUrl);
    };
    reader.readAsDataURL(file);
  });

  var avatarPressTimer = null;
  var avatarLongPressFired = false;
  inviteAvatar.addEventListener('pointerdown', function(){
    avatarLongPressFired = false;
    avatarPressTimer = setTimeout(function(){
      avatarLongPressFired = true;
      try { localStorage.removeItem(AVATAR_KEY); } catch(e){}
      applyAvatar(null);
      if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
    }, 600);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    inviteAvatar.addEventListener(ev, function(){
      if (avatarPressTimer) { clearTimeout(avatarPressTimer); avatarPressTimer = null; }
    });
  });
  inviteAvatar.addEventListener('click', function(){
    if (avatarLongPressFired) { avatarLongPressFired = false; return; }
    avatarFileInput.click();
  });

  function setChroma(idx){
    chromaIndex = (idx + chromaColors.length) % chromaColors.length;
    chromaBg.style.background = chromaColors[chromaIndex];
  }

  var swipeStartX = null;
  liveScreen.addEventListener('pointerdown', function(e){ swipeStartX = e.clientX; });
  liveScreen.addEventListener('pointerup', function(e){
    if (swipeStartX === null) return;
    var dx = e.clientX - swipeStartX;
    swipeStartX = null;
    if (Math.abs(dx) < 40) return;
    setChroma(chromaIndex + (dx < 0 ? 1 : -1));
  });

  function showScreen(el){
    [inviteScreen, liveScreen, endScreen].forEach(function(s){ s.classList.remove('active'); });
    el.classList.add('active');
  }

  document.getElementById('acceptButton').addEventListener('click', function(){
    showScreen(liveScreen);
    if (navigator.vibrate) { try { navigator.vibrate(50); } catch(e){} }
  });

  document.getElementById('declineButton').addEventListener('click', function(){
    showScreen(endScreen);
  });

  document.getElementById('leaveButton').addEventListener('click', function(){
    showScreen(endScreen);
  });

  function resetToInvite(){
    showScreen(inviteScreen);
  }

  document.getElementById('redoButton').addEventListener('click', resetToInvite);
})();
</script>
</body>
</html>
